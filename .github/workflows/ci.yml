name: Java CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JUnit 4
        run: |
          mkdir -p lib
          curl -sSfL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile sources and tests
        run: |
          mkdir -p out
          javac -d out -cp "lib/*" $(find src test -name "*.java")

      - name: Run unit tests
        run: java -cp "out:lib/*" org.junit.runner.JUnitCore poe.partone.LoginTest poe.partone.MessageTest